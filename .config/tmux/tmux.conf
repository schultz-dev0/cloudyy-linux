set-option -g history-limit 100000
set -g mouse on

set -s extended-keys always
set -as terminal-features 'xterm*:extkeys'

# Wayland / Hyprland / UWSM environment inheritance
set-option -g update-environment "WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE UWSM_ID"

# Allow applications, including remote SSH apps, to copy through OSC 52.
set -s set-clipboard on
