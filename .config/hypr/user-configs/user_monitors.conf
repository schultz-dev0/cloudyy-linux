# ─────────────────────────────────────────────────────────────────
# Hyprland monitor configuration — generated by hyprmon
# Compatible with Hyprland v0.54+
#
# To apply, add the following line to hyprland.conf:
#   source = ~/.config/hypr/user-configs/user_monitors.conf
# ─────────────────────────────────────────────────────────────────

monitor=eDP-1,1920x1080@60,0x0,1
monitor=HDMI-A-1,2560x1440@60,2000x0,1

device {
    name = weylus-stylus
    output = HDMI-A-1 # Replace with your actual monitor name (e.g., HDMI-A-1)
}
