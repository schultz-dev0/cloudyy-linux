# colour importing
source = ~/.config/matugen/generated/hyprcolors.conf
source = ~/.config/hypr/source/lookandfeel.conf

# General sourcing

source = ~/.config/hypr/user-configs/user_monitors.conf
source = ~/.config/hypr/source/input.conf
#source = ~/.config/hypr/source/bindings.conf  # disabled: user_bindings.conf is sourced below and covers all bindings
source = ~/.config/hypr/user-configs/user_windowrules.conf


# Animations

source = ~/.config/hypr/source/animations.conf

# autostart

source = ~/.config/hypr/user-configs/user_autostart.conf

# Cloud Center managed overrides — added by hypr_persist.sh
source = ~/.config/hypr/user-configs/user_cloud-center.conf

#plugin = /home/schultz/cloudyy_scripts/cloud_border/cloud_border.so

# cloudyy-gpu-env — injected by cloudyy-linux installer (nvidia)
env = LIBVA_DRIVER_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = WLR_NO_HARDWARE_CURSORS,1
env = NVD_BACKEND,direct

# Cloud Center — managed keybinds
source = ~/.config/hypr/hyprland-keybinds-cloud-center.conf

# Cloud Center animation overrides — added by hypr_persist.sh
source = ~/.config/hypr/user-configs/user_animations.conf

# Cloud Center input overrides — added by hypr_persist.sh
source = ~/.config/hypr/user-configs/user_input.conf

# Cloud Center auto-sourced user config — added by hypr_persist.sh
source = ~/.config/hypr/user-configs/user_bindings.conf


# Cloud Center auto-sourced user config — added by hypr_persist.sh
source = ~/.config/hypr/user-configs/user_lookandfeel.conf
