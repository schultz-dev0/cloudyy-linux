#description = Responsible for apps that start on boot, DO NOT edit unless you know what you are doing!!

# Autostart apps
# Quickshell autostart lives in source/quickshell.conf:
# exec-once = env QS_NO_RELOAD_POPUP=1 qs -d

exec-once = $terminal
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = hyprlock
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = syncthing
exec-once = hyprlock
exec-once = ~/cloudyy_scripts/cloudyy-other/hyprdock
# Restore last wallpaper and theme on login
exec-once = ~/cloudyy_scripts/theme_controller.sh restore
exec-once = ollama
exec-once = ollama run llama3.2
# exec-once = ~/cloudyy_scripts/cloudyy-other/hyprdoc # deprecated in favour of quickshell
