# Quickshell autostart — canonical command read by hypr autostart.lua
# Launch env (QS_NO_RELOAD_POPUP, CLOUDYY_LIGHTWEIGHT) comes from Cloud Center via qs_start.sh
# Stop swaync first — it registers org.freedesktop.Notifications and blocks quickshell.
exec-once = sh -c 'systemctl --user stop swaync.service 2>/dev/null; systemctl --user mask swaync.service 2>/dev/null; killall swaync 2>/dev/null; exec ~/cloudyy_scripts/quickshell/qs_start.sh'
