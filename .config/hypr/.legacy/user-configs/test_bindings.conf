#--------------------------------------------------------------#
# Do NOT edit this file, please visit /hypr/user_configs, add your
# own config and source them in hyprland.conf
#--------------------------------------------------------------#
#

#--------------------------------------------------------------#
# Variables


$scripts = ~/cloudyy_scripts

#--------------------------------------------------------------#
# General

source = /home/schultz/.config/hypr/source/variables.conf

# Tiling

bind   = $mainMod, W, Kills active window, killactive,
bind   = $mainMod, T, Toggle floating window, togglefloating,
bind   = $mainMod, F, Toggle fullscreen, fullscreen, 0,

# Apps

bind   = $mainMod, Return, Open terminal, exec, uwsm-app kitty
bind   = $mainMod SHIFT, F, Open filemanager, exec, uwsm-app $fileManager 
bind   = $mainMod SHIFT, B, Open browser, exec, $browser --new-window
bind   = $mainMod SHIFT, M, Open spotify, exec, uwsm-app spotify
bind   = $mainMod SHIFT, O, Open OBS, exec, uwsm-app obs

# Custom apps

bind   = $mainMod SHIFT, K, Launch keypunch, exec, $scripts/cloudyy-other/keypunch
bind   = ALT, 1, Wi-Fi Manager, exec, uwsm-app -- $scripts/cloud-center --wifi
bind   = ALT, 2, Bluetooth Manager, exec, uwsm-app -- $scripts/cloud-center --bluetooth
bind   = ALT, 3, Audio Mixer, exec, uwsm-app -- $scripts/cloud-center --audio
bind   = ALT, 4, Cloud Center, exec, uwsm-app python3 $scripts/cloud-center-v2/cloud-center.py
bind   = ALT, 6, Visual Input toggle, exec, pkill -x visinput || $scripts/cloudyy-other/visinput
# quickshell

bind   = $mainMod, TAB, Open workspace overview, exec, quickshell ipc call overview togglefloating
bind   = $mainMod, D, Open spotlight search, exec, quickshell ipc call spotlight toggle

# rofi

bind   = $mainMod ALT, Space, Rofi menu launch, exec, $scripts/rofi/main.sh || pkill rofi
bind   = ALT, Space, Rofi theme menu, exec, $scripts/rofi/appearance.sh --select || pkill rofi
bind   = $mainMod, Space, Open rofi menu, exec, $scripts/rofi/applications.sh || pkill rofi

# bind = $mainMod SHIFT, C, exec
 
#--------------------------------------------------------------#
# Utilities

bind   = SHIFT, PRINT, Screenshot region and save, exec, hyprcap shot region -z -w
bind   = , PRINT, Clipboard only, exec, hyprcap shot region -z -c -n
bind   = ALT, PRINT, Start screenrecording, exec, hyprcap rec region -c -w
bind   = $mainMod, PRINT, Colour picker, exec, hyprpicker -a || pkill hyprpicker
bind   = ALT, 5, Restart waybar, exec, uwsm-app $scripts/waybar/launch_waybar.sh 
bind   = $mainMod SHIFT, W, Random wallpaper change, exec, $scripts/theme_controller.sh random

# Appearence

bind   = $mainMod, L, Switch between light and dark themes, exec, $scripts/theme_controller.sh toggle


# Bind volume keys for laptops

bindel  = , XF86AudioRaiseVolume, exec, $scripts/sliders/volume-slider.sh up
bindel  = , XF86AudioLowerVolume, exec, $scripts/sliders/volume-slider.sh down
bindl   = , XF86AudioMute, exec, $scripts/sliders/volume-slider.sh mute


# Audio
bind   = $mainMod, X, Next song, exec, playerctl next
bind   = $mainMod, Z, Previous song, exec, playerctl previous
bind   = $mainMod, P, Pause/play music, exec, playerctl play-pause

## Volume keys ##

bindel  = $mainMod, up, exec, $scripts/sliders/volume-slider.sh up
bindel  = $mainMod, down, exec, $scripts/sliders/volume-slider.sh down
bindl   = $mainMod, m, exec, $scripts/sliders/volume-slider.sh mute

# swaync utilities

bind   = $mainMod, N, Toggle notif center, exec, qs ipc call notifs toggle
bind   = $mainMod SHIFT, N, Toggle DND, exec, qs ipc call notifs dnd
bind   = $mainMod CTRL, N, Close last notif, exec, qs ipc call notifs dismissLast

# window management

bind   = ALT, TAB, Cycling tab like windows, cyclenext
bind   = $mainMod, I, Toggles opacity, setprop, active opaque toggle

# Arrow key movement between open windows

binded  = $mainMod SHIFT, left, Focus Left, movefocus, l
binded  = $mainMod SHIFT, right, Focus Right, movefocus, r
binded  = $mainMod SHIFT, up, Focus Up, movefocus, u
binded  = $mainMod SHIFT, down, Focus Down, movefocus, d

# Arrow key movment OF windows

binded  = $mainMod CTRL, left, Move left, movewindow, l
binded  = $mainMod CTRL, right, Move right, movewindow, r
binded  = $mainMod CTRL, up, Move up, movewindow, u
binded  = $mainMod CTRL, down, Move down, movewindow, d

#--------------------------------------------------------------#
# clipboard binds

bind   = $mainMod CTRL, Space, Open clipboard history, exec, uwsm-app cliphist list | rofi -dmenu | cliphist decode | wl-copy

# Universal cop and paste

bind = $mainMod, C, Universal copy (context-aware), exec, ~/cloudyy_scripts/clipboard/clipboard.sh copy
bind = $mainMod, V, Universal paste (context-aware), exec, ~/cloudyy_scripts/clipboard/clipboard.sh paste

#--------------------------------------------------------------#
# Workspaces
# Switch workspaces with mainMod + [0-9]

bind    = $mainMod, 1, workspace, 1
bind    = $mainMod, 2, workspace, 2
bind    = $mainMod, 3, workspace, 3
bind    = $mainMod, 4, workspace, 4
bind    = $mainMod, 5, workspace, 5
bind    = $mainMod, 6, workspace, 6
bind    = $mainMod, 7, workspace, 7
bind    = $mainMod, 8, workspace, 8
bind    = $mainMod, 9, workspace, 9
bind    = $mainMod, 0, workspace, 10


# Move active window to a workspace with mainMod + SHIFT + [0-9]

bind    = $mainMod SHIFT, 1, movetoworkspace, 1
bind    = $mainMod SHIFT, 2, movetoworkspace, 2
bind    = $mainMod SHIFT, 3, movetoworkspace, 3
bind    = $mainMod SHIFT, 4, movetoworkspace, 4
bind    = $mainMod SHIFT, 5, movetoworkspace, 5
bind    = $mainMod SHIFT, 6, movetoworkspace, 6
bind    = $mainMod SHIFT, 7, movetoworkspace, 7
bind    = $mainMod SHIFT, 8, movetoworkspace, 8
bind    = $mainMod SHIFT, 9, movetoworkspace, 9
bind    = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)

bind    = $mainMod, S, togglespecialworkspace, magic
bind    = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll

bind    = $mainMod, mouse_down, workspace, e+1
bind    = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging

bindm   = $mainMod, mouse:272, movewindow
bindm   = $mainMod, mouse:273, resizewindow

# --------------------------------------------------------#
# others
# Laptop multimedia keys for volume and LCD brightness

bindel = , XF86MonBrightnessUp,   exec, $scripts/sliders/brightness-slider.sh up
bindel = , XF86MonBrightnessDown, exec, $scripts/sliders/brightness-slider.sh down

bindel  = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel  = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
bindel  = ,XF86FullScreen, exec, fullscreen, 0
bindel  = ,XF86LaunchA, exec, $scripts/rofi-menu.sh --menu || pkill rofi


# Requires playerctl

bindl   = , XF86AudioNext, exec, playerctl next
bindl   = , XF86AudioPause, exec, playerctl play-pause
bindl   = , XF86AudioPlay, exec, playerctl play-pause
bindl   = , XF86AudioPrev, exec, playerctl previous

# others
bind    = $mainMod SHIFT, R, Reloads Hyprland, exec, hyprctl reload


# --- Cloud Center Additions (managed by Cloud Center) ---
bind = SUPER CTRL, K, exec, rusty_keys
# --- End Cloud Center Additions ---
bind =  CTRL, T, exec, kitty
bind    = $mainMod SHIFT, E, Live Text Extraction, exec, ~/cloudyy_scripts/clipboard/text_extract.sh
