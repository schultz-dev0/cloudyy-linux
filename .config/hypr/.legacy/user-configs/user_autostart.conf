#description = Responsible for apps that start on boot, DO NOT edit unless you know what you are doing!!

# Autostart apps
# Quickshell autostart is managed in ~/.config/hypr/source/shell-stack.conf:
# exec-once = env QS_NO_RELOAD_POPUP=1 qs -d

exec-once = $terminal
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = hyprlock
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = syncthing
exec-once = hyprlock
# exec-once = hyprlock || hyprctl dispatch exit
exec-once = ~/cloudyy_scripts/theme_controller.sh restore
exec-once = ~/cloudyy_scripts/cloudyy-other/hyprdock
exec-once = ollama
# exec-once = ollama run llama3.2

exec-once = swayosd-server
#exec-once = hyprdock

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = gnome-keyring-daemon --start --components=secrets

#exec-once = sudo systemctl start OpenLinkHub.service
exec-once = trcc theme-load "Custom_Grace"
exec-once = ~/cloudyy_scripts/ssh-auth.sh
