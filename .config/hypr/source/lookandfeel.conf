#--------------------------------------------------------------#
# Do not edit this! Visit the "user-configs" folder 

# General

source = ~/.config/matugen/generated/hyprcolors.conf

general {

    col.active_border = $primary
    col.inactive_border = $inverse_on_surface
    layout = dwindle
# allows tearing for lower latency
    allow_tearing = true
    gaps_in = 2
    gaps_out = 2
    border_size = 2
}


# Decor

decoration {
    # --- Rounding ---
    rounding                  = 6
    rounding_power            = 6.0

    # --- Opacity ---
    active_opacity            = 0.9
    inactive_opacity          = 0.8 # LMFAOOOOOOOOO 6767676767... it was 67 now it's different cuz too opaque
    fullscreen_opacity        = 1.0

    # --- Dimming ---
    dim_inactive              = true
    dim_strength              = 0.2
    dim_special               = 0.8           # Stronger dimming for special workspace to highlight content

    # --- Shadows ---
    # Enabled because your hardware (12700H) can easily handle it.
    shadow {
        enabled               = true
        range                 = 25
        render_power          = 1 #(values betwwen 1 and 4, no higher than 4, cuz invalid)
        color                 = rgba(1a1a1aee)
        #or
        #color= $primary
        #offset = 0 0    # Displaces shadow (x, y). 10 down makes it look like the light is above.
        #scale = 1
    }

    # --- Blur ---
    # Enabled for aesthetic depth.
    blur {
        enabled               = true
        size                  = 4                # Radius
        passes                = 3              # Quality (2 is a good balance of perf/looks)
        new_optimizations     = true
        ignore_opacity        = true   # Blurs behind transparent windows even if opacity is high
        xray                  = false            # If true, you can "see through" the blur.
        vibrancy              = 0.1696 #0.1696
        popups                = true
    }

    # --- Shaders ---
    # screen_shader = ~/.config/hypr/shaders/grayscale_advanced.glsl
}

windowrulev                   = float, class ^(volume-slider)$
windowrulev                   = center, class ^(volume-slider)$
windowrulev                   = stayfocused, class ^(volume-slider)$
windowrulev                   = immediate, class ^(game_class)$

# environmental variables

env                           = XCURSOR_size,24
env                           = HYPRCURSOR_SIZE,24

# Performance for laptops

#decoration:blur:enabled      = false
#decoration:shadow:enabled    = false
misc:vfr                      = true

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
# Layout
dwindle {                                                                                      
   pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the
   preserve_split = true # You probably want this
}
