#description = This is responsible for making windows smaller or large, floating or not and so on

#--------------------------------------------------------------#
# Do NOT edit this file, please visit /hypr/user_configs, add your
# own config and source them in hyprland.conf
#--------------------------------------------------------------#
#

#===============================================================#

# Properly organised window rule config that does... window rules.

#===============================================================#

source = $HOME/.config/hypr/source/variables.conf

#--------------------------------------------------------------#

# --- Application specific rules --- #

# Brave browser #
windowrule {
    name            = firefox
    match:class     = ^(firefox)$
    size            = 1080 1080
    float           = on
  }

windowrule {
    name            = opaque-youtube
    match:class     = ^(firefox)$
    match:title     = .*Youtube.*
    opaque          = on

  }

# image-viewer (loupe) #
windowrule {
    name            = image-viewer
    match:class     = ^(org.gnome.Loupe)$
    size            = 1280 720
    float           = on

  }

# Termial #
windowrule {
    name            = terminal
    match:class     = ^(.*kitty)$
    size            = 1080 900
    float           = on
  }

# Steam #
windowrule {
    name            = Steam
    match:class     = ^(.*steam)$
    size            = 1280 720
    float           = on
  }

# MPV #
windowrule {
    name            = mpv player
    match:class     = ^(.*mpv)$
    size            = 1280 720
    float           = on
  }

# Keypunch 
windowrule {
    name            = Keypunch
    match:class     = ^(.*Keypunch)$
    size            = 1280 720
    float           = on
  }

# --- Utilities --- #

# Blueman 
windowrule {
    name            = float-blueman
    match:class     = ^(blueman-manager)$
    float           = on
    size            = 530 313 # Medium size for device lists
    center          = on
}

# Bluetui
windowrule {
    name            = bluetui
    match:class     = ^(bluetui)$
    float           = on
    size            = 551 362
    center          = on
}

# Spotify
windowrule {
    name            = spotify
    match:class     = ^(spotify)$
    float           = on
    size            = 900 900
    center          = on
}

windowrule {
    name            = pavu
    match:class     = ^(org.pulseaudio.pavucontrol)$
    float           = on
    size            = 551 362
    center          = on
  }

# cloud center
windowrule {
    name            = cloudcenter
    match:class     = ^(dev.cloudyy.CloudCenter)$
    float           = on
    size            = 1000 960
    center          = on
}

# --- Side panels and control center --- #
#swaync rule
layerrule {
    name            = swaync_slide
    match:namespace = swaync-control-center
    animation       = slide left
    dim_around      = off
    blur            = on

  # For the blur to work, your Hyprland config value must be LOWER than your CSS value.
  # ignore_alpha<CSS Opacity

    ignore_alpha    = 0.2
}

# 2. Notification Popups (Floating Windows)
layerrule {
    name            = swaync_notifications
    match:namespace = swaync-notification-window
    blur            = on

  # For the blur to work, your Hyprland config value must be LOWER than your CSS value.
  # ignore_alpha<CSS Opacity

    ignore_alpha    = 0.2
}

#rofi rule
layerrule {
    name            = rofi
    match:namespace = rofi
    animation       = slide down
    #dim_around     = on
}

#wlogout
layerrule {
    name            = logout_dialog_style
    match:namespace = logout_dialog
    blur            = on
    ignore_alpha    = 0.0
}

# waybar
layerrule {
    name            = waybar-blur
    match:namespace = waybar
    blur            = true
    xray            = true
  }



# --- General stuff --- #

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}
