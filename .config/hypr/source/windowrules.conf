#description = This is responsible for making windows smaller or large, floating or not and so on

#--------------------------------------------------------------#
# Do NOT edit this file, please visit /hypr/user_configs, add your
# own config and source them in hyprland.conf
#--------------------------------------------------------------#
#

#===============================================================#

# Properly organised window rule config that does... window rules.

#===============================================================#

source = $HOME/.config/hypr/source/variables.conf

#--------------------------------------------------------------#

# --- Application specific rules --- #

# Brave browser #
windowrule {
    name            = firefox
    match:class     = ^(firefox)$
    size            = 1080 1080
    float           = on
  }

windowrule {
    name            = opaque-youtube
    match:class     = ^(firefox)$
    match:title     = .*Youtube.*
    opaque          = on

  }

# image-viewer (loupe) #
windowrule {
    name            = image-viewer
    match:class     = ^(org.gnome.Loupe)$
    size            = 1280 720
    float           = on

  }

# Termial #
windowrule {
    name            = terminal
    match:class     = ^(.*kitty)$
    size            = 1080 900
    float           = on
  }

# Steam #
windowrule {
    name            = Steam
    match:class     = ^(.*steam)$
    size            = 1280 720
    float           = on
  }

# MPV #
windowrule {
    name            = mpv player
    match:class     = ^(.*mpv)$
    size            = 1280 720
    float           = on
  }

# Keypunch 
windowrule {
    name            = Keypunch
    match:class     = ^(.*Keypunch*.)$
    size            = 1280 720
    float           = on
  }

# rustykeys 
windowrule {
    name            = rustykeys
    match:class     = ^(org.cloudyy.rustykeys)$
    float           = on
    size            = 550 420
    center          = on
}

# --- Utilities --- #

# Blueman 
windowrule {
    name            = float-blueman
    match:class     = ^(blueman-manager)$
    float           = on
    size            = 530 313 # Medium size for device lists
    center          = on
}

windowrule {
    name            = thunar-rename
    match:class     = ^(thunar)$
    match:title     = .*thunar*.
    float           = on
    size            = 530 400
    center          = on
}

windowrule {
    name            = thunar
    match:class     = ^(thunar)$
    float           = on
    size            = 1080 900
    center          = on
}

# Bluetui
windowrule {
    name            = bluetui
    match:class     = ^(bluetui)$
    float           = on
    size            = 551 362
    center          = on
}

# Spotify
windowrule {
    name            = spotify
    match:class     = ^(spotify)$
    float           = on
    size            = 900 900
    center          = on
}

windowrule {
    name            = pavu
    match:class     = ^(org.pulseaudio.pavucontrol)$
    float           = on
    size            = 551 362
    center          = on
  }

# cloud center
windowrule {
    name            = cloudcenter
    match:class     = ^(dev.cloudyy.CloudCenter)$
    float           = on
    size            = 1000 960
}

# openrgb
windowrule {
    name            = openrgb
    match:class     = org.openrgb.OpenRGB
    float           = on
    size            = 1000 960
}


# --- Side panels and control center --- #
# Quickshell control center & popups (replaces swaync rules)
layerrule {
    name            = quickshell_panel
    match:namespace = ^(quickshell)$
    blur            = on
    ignore_alpha    = 0.2
}

# Quickshell workspace overview
layerrule {
    name            = quickshell_overview
    match:namespace = ^quickshell:overview$
    blur            = on
    ignore_alpha    = 0.05
}

# Quickshell dock
layerrule {
    name            = quickshell_dock
    match:namespace = ^quickshell:dock$
    blur            = on
    ignore_alpha    = 0.05
}

# 3. Yad sliders
windowrule {
    name            = yad_sliders
    match:class     = ^(yad)$
    size            = 350 100
    float           = on
    center          = on
}

#rofi rule
layerrule {
    name            = rofi
    match:namespace = rofi
    animation       = slide down
    #dim_around     = on
}

#wlogout
layerrule {
    name            = logout_dialog_style
    match:namespace = logout_dialog
    blur            = on
    ignore_alpha    = 0.0
}

# waybar
layerrule {
    name            = waybar-blur
    match:namespace = waybar
    ignore_alpha    = 0.5
    blur            = true 
    xray            = true
  }



# --- General stuff --- #

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}


# hyprdock
layerrule {
    name            = hyprdock
    match:namespace = ^(hyprdock)$
    blur            = on
    ignore_alpha    = 0.01
}

layerrule {
    name            = hyprdock spotlight
    match:namespace = ^(hyprdock-spotlight.*)$
    blur            = on
    ignore_alpha    = 0.01
}

layerrule {
    name            = hyprdock trigger
    match:namespace = ^(hyprdock-trigger)$
    blur            = off
}

layerrule {
    name            = slurp
    match:namespace = ^(slurp)$
    blur            = off
}

layerrule {
    name            = hyprpicker
    match:namespace = ^(hyprpicker)$
    blur            = off
}
