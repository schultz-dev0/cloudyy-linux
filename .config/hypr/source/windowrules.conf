
#--------------------------------------------------------------#
# Do not edit this file, find the user file in the user-configs folder
# This config was far too big to fit in look and feel so I might as well make a new file


#===============================================================#

# Properly organised window rule config that does... window rules.

#===============================================================#

source = $HOME/.config/hypr/source/variables.conf

#--------------------------------------------------------------#

# --- Application specific rules --- #

# Brave browser #
windowrule {
    name        = firefox
    match:class = ^(firefox)$
    size        = 1080 1080
    float       = on
  }

windowrule {
    name        = opaque-youtube
    match:class = ^(firefox)$
    match:title = .*Youtube.*
    opaque      = on

  }

# image-viewer (loupe) #
windowrule {
    name        = image-viewer
    match:class = ^(org.gnome.Loupe)$
    size        = 1280 720
    float       = on

  }

# Termial #
windowrule {
    name        = terminal
    match:class = ^(.*kitty)$
    size        = 1080 900
    float       = on
  }

# Steam #
windowrule {
    name        = Steam
    match:class = ^(.*steam)$
    size        = 1280 720
    float       = on
  }

# MPV #
windowrule {
    name        = mpv player
    match:class = ^(.*mpv)$
    size        = 1280 720
    float       = on
  }

# Keypunch 
windowrule {
    name        = Keypunch
    match:class = ^(.*Keypunch)$
    size        = 1280 720
    float       = on
  }

# --- Utilities --- #

# Blueman 
windowrule {
    name        = float-blueman
    match:class = ^(blueman-manager)$
    float       = on
    size        = 530 313 # Medium size for device lists
    center      = on
}

# Bluetui
windowrule {
    name        = bluetui
    match:class = ^(bluetui)$
    float       = on
    size        = 551 362
    center      = on
}

# Spotify
windowrule {
    name        = spotify
    match:class = ^(spotify)$
    float       = on
    size        = 900 900
    center      = on
}

windowrule {
    name        = pavu
    match:class = ^(org.pulseaudio.pavucontrol)$
    float       = on
    size        = 551 362
    center      = on
  }
