# Quickshell autostart — canonical command read by hypr autostart.lua
# QS_NO_RELOAD_POPUP disables the native "config updated" reload notification.
# Stop swaync first — it registers org.freedesktop.Notifications and blocks quickshell.
exec-once = sh -c 'systemctl --user stop swaync.service 2>/dev/null; systemctl --user mask swaync.service 2>/dev/null; killall swaync 2>/dev/null; exec env QS_NO_RELOAD_POPUP=1 qs -n -d'
