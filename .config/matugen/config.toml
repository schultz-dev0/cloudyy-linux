# wallpaper

[config]
variant = "scheme-rainbow"
contrast = 0

[config.wallpaper]
command = "/usr/bin/swww"
arguments = [
  "img",
  "--transition-type",
  "center",
  "--transition-step",
  "15",
  "--transition-fps",
  "60",
]
set = false

# hyprland config

[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland-colors.conf'
output_path = '~/.config/matugen/generated/hyprcolors.conf'
post_hook = 'hyprctl reload'

# waybar config

[templates.waybar]
input_path = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/matugen/generated/waybar-colors.css'

# starship config

[templates.starship]
input_path = "~/.config/matugen/templates/starship_preset.tera"
output_path = "~/.config/matugen/generated/starship.toml"

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/matugen/generated/gtk-3.css'
post_hook = 'thunar -q 2>/dev/null; sleep 0.3; thunar --daemon &'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/matugen/generated/gtk-4.css'

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty-colors.conf'
output_path = '~/.config/matugen/generated/kitty-colors.conf'
post_hook = '~/.config/kitty/matugen-reload.sh'

[templates.nvim]
input_path = '~/.config/matugen/templates/nvimmode.lua'
output_path = '~/.config/matugen/generated/matugen_colors.lua'
post_hook = '~/cloudyy_scripts/nvim/reload_theme.sh'

[templates.rofi]
input_path = '~/.config/matugen/templates/colors.rasi'
output_path = '~/.config/matugen/generated/colors-glass.rasi'

[templates.swaync]
input_path = '~/.config/matugen/templates/colors-swaync.css'
output_path = '~/.config/matugen/generated/colors-swaync.css'

[templates.swayosd]
input_path = '~/.config/matugen/templates/colors-swayosd.css'
output_path = '~/.config/matugen/generated/colors-swayosd.css'
post_hook = '~/cloudyy_scripts/swayosd/restart_swayosd.sh'

[templates.wlogout]
input_path = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/matugen/generated/colors.css'

[templates.btop]
input_path = '~/.config/matugen/templates/btop.theme'
output_path = '~/.config/matugen/generated/btop.theme'
post_hook = 'pkill -USR2 btop || true'

[templates.quickshell]
input_path = '~/.config/matugen/templates/quickshell-theme.qml'
output_path = '~/.config/quickshell/Theme.qml'
# quickshell auto-reloads QML on file change; no post_hook needed

[templates.Obsidian]
input_path = '~/.config/matugen/templates/obsidian-theme.css'
output_path = '~/MyLife/.obsidian/snippets/matugen-theme.css'

[templates.pywalfox]
input_path = '~/.config/matugen/templates/pywal.json'
output_path = '~/.cache/wal/colors.json'
post_hook = 'pywalfox update'

[templates.vscodium]
input_path = '~/.config/matugen/templates/vscode-theme.json'
output_path = '~/.config/matugen/generated/vscode.json'
post_hook = "python3 ~/cloudyy_scripts/code/update_vscodium.py"

#[templates.vesktop]
#input_path = "~/.config/matugen/templates/vesktop_theme.css"
#output_path = "~/.config/matugen/generated/vesktop_theme.css"

[templates.vesktop]
input_path = '~/.config/matugen/templates/vesktop_theme.css'
output_path = '~/.config/matugen/generated/vesktop_theme.css'
post_hook = '''
if command -v vesktop >/dev/null 2>&1; then
  mkdir -p "$HOME/.config/vesktop/themes/"
  ln -nfs "$HOME/.config/matugen/generated/vesktop_theme.css" "$HOME/.config/vesktop/themes/vesktop_theme.css"
fi
'''

[templates.cloud-center]
input_path = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/matugen/generated/waybar-colors.css'
post_hook = '~/cloudyy_scripts/cloud-center-v2/cc-restart.sh'

# Zen Browser UI (userChrome.css)
[templates.zen_chrome]
input_path = '~/.config/matugen/templates/userChrome.css.tera'
output_path = '~/.config/mozilla/firefox/7i31mCQb.Profile 1/chrome/userChrome.css'

# Zen Browser Content (userContent.css)
[templates.zen_content]
input_path = '~/.config/matugen/templates/userContent.css.tera'
output_path = '~/.config/mozilla/firefox/7i31mCQb.Profile 1/chrome/userContent.css'

# Zen Browser Colors (shared by chrome/content)
[templates.zen_colors]
input_path = '~/.config/matugen/templates/colors.css.tera'
output_path = '~/.config/mozilla/firefox/7i31mCQb.Profile 1/chrome/colors.css'
