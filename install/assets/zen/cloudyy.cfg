// CLOUDYY-ZEN-LIVE-THEME: zen-live-theme-v1

function cloudyyValidateSignal(value) {
  if (!value || Object.getPrototypeOf(value) !== Object.prototype) return null;
  const keys = Object.keys(value).sort();
  if (keys.join(",") !== "generation,mode,schema") return null;
  if (value.schema !== 1) return null;
  if (!/^stage\.[A-Za-z0-9]{8}$/.test(value.generation)) return null;
  if (value.mode !== "dark" && value.mode !== "light") return null;
  return { generation: value.generation, mode: value.mode };
}

function cloudyyModePreferences(mode) {
  return mode === "dark"
    ? { "ui.systemUsesDarkTheme": 1, "zen.view.window.scheme": 0 }
    : { "ui.systemUsesDarkTheme": 0, "zen.view.window.scheme": 1 };
}

function cloudyyCreateBridge(dependencies) {
  let started = false;
  let reading = false;
  let pendingGeneration = null;
  let attempts = 0;
  let reportedError = null;

  async function poll() {
    if (reading) return;
    reading = true;
    try {
      const raw = await dependencies.readSignal();
      if (raw === null) return;
      const signal = cloudyyValidateSignal(raw);
      if (!signal) throw new Error("invalid-signal");
      if (pendingGeneration === null &&
          signal.generation === dependencies.getApplied()) {
        return;
      }
      if (pendingGeneration !== signal.generation) {
        pendingGeneration = signal.generation;
        attempts = 0;
      }
      const marker = "cloudyy-generation: " + pendingGeneration;
      const sheet = await dependencies.readSheetText();
      if (sheet !== null && sheet.includes(marker)) {
        dependencies.setApplied(pendingGeneration);
        pendingGeneration = null;
        reportedError = null;
        return;
      }
      if (attempts >= 5) {
        const key = "rebuild-not-confirmed";
        if (key !== reportedError) dependencies.report(key);
        reportedError = key;
        dependencies.setApplied(pendingGeneration);
        pendingGeneration = null;
        return;
      }
      if (!dependencies.backendAvailable()) {
        throw new Error("mods-backend-unavailable");
      }
      attempts += 1;
      dependencies.applyMode(cloudyyModePreferences(signal.mode));
      dependencies.triggerMods();
      reportedError = null;
    } catch (error) {
      const key = String(error && error.message || error);
      if (key !== reportedError) dependencies.report(key);
      reportedError = key;
    } finally {
      reading = false;
    }
  }

  function start() {
    if (started) return;
    started = true;
    dependencies.schedule(poll, 1000);
  }

  return { poll, start };
}

if (!globalThis.CLOUDYY_ZEN_BRIDGE_TEST) {
  const prefBranch = Cc["@mozilla.org/preferences-service;1"].getService(
    Ci.nsIPrefBranch
  );
  const observerService = Cc["@mozilla.org/observer-service;1"].getService(
    Ci.nsIObserverService
  );
  const consoleService = Cc["@mozilla.org/consoleservice;1"].getService(
    Ci.nsIConsoleService
  );
  const directoryService = Cc["@mozilla.org/file/directory_service;1"].getService(
    Ci.nsIProperties
  );
  const timerSymbol = Symbol.for("cloudyy.zenLiveTheme.timer");

  function cloudyyProfileFile(name) {
    const profile = directoryService.get("ProfD", Ci.nsIFile);
    profile.append("chrome");
    profile.append(name);
    return profile;
  }

  function cloudyyReadTextFile(file, maxBytes) {
    if (file.isSymlink() || !file.isFile() || file.fileSize > maxBytes) {
      throw new Error("invalid-signal-file");
    }
    const stream = Cc["@mozilla.org/network/file-input-stream;1"].createInstance(
      Ci.nsIFileInputStream
    );
    stream.init(file, 0x01, 0, 0);
    const converter = Cc[
      "@mozilla.org/intl/converter-input-stream;1"
    ].createInstance(Ci.nsIConverterInputStream);
    converter.init(stream, "UTF-8", 4096, 0xfffd);
    let text = "";
    const chunk = {};
    while (converter.readString(4096, chunk) > 0) {
      text += chunk.value;
    }
    converter.close();
    return text;
  }

  function cloudyyReadSignal() {
    const file = cloudyyProfileFile("cloudyy-theme-signal.json");
    if (!file.exists()) return null;
    const text = cloudyyReadTextFile(file, 4096);
    try {
      return JSON.parse(text);
    } catch {
      throw new Error("invalid-signal");
    }
  }

  function cloudyyReadSheetText() {
    const file = cloudyyProfileFile("zen-themes.css");
    if (!file.exists()) return null;
    try {
      return cloudyyReadTextFile(file, 1048576);
    } catch {
      return null;
    }
  }

  function cloudyyStartBridge() {
    if (globalThis[timerSymbol]) return;
    const bridge = cloudyyCreateBridge({
      readSignal: () => cloudyyReadSignal(),
      readSheetText: () => cloudyyReadSheetText(),
      getApplied() {
        return prefBranch.getStringPref(
          "cloudyy.zen.lastAppliedGeneration",
          ""
        );
      },
      setApplied(generation) {
        prefBranch.setStringPref(
          "cloudyy.zen.lastAppliedGeneration",
          generation
        );
      },
      backendAvailable() {
        try {
          Cc["@mozilla.org/zen/mods-backend;1"].getService(
            Ci.nsIZenModsBackend
          );
          return true;
        } catch {
          return false;
        }
      },
      applyMode(preferences) {
        prefBranch.setIntPref(
          "ui.systemUsesDarkTheme",
          preferences["ui.systemUsesDarkTheme"]
        );
        prefBranch.setIntPref(
          "zen.view.window.scheme",
          preferences["zen.view.window.scheme"]
        );
      },
      triggerMods() {
        const key = "zen.mods.updated-value-observer";
        prefBranch.setBoolPref(key, !prefBranch.getBoolPref(key, false));
      },
      report(key) {
        consoleService.logStringMessage(`[CloudyyZenTheme] ${key}`);
      },
      schedule(callback, interval) {
        const timer = Cc["@mozilla.org/timer;1"].createInstance(Ci.nsITimer);
        timer.initWithCallback(
          callback,
          interval,
          Ci.nsITimer.TYPE_REPEATING_SLACK
        );
        globalThis[timerSymbol] = timer;
      },
    });
    bridge.start();
  }

  const cloudyyStartupObserver = {
    observe() {
      observerService.removeObserver(
        cloudyyStartupObserver,
        "browser-delayed-startup-finished"
      );
      cloudyyStartBridge();
    },
  };

  observerService.addObserver(
    cloudyyStartupObserver,
    "browser-delayed-startup-finished"
  );
}
