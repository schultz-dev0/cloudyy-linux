#!/usr/bin/env bash
# =============================================================================
# shell-stack.conf — cloudyy-linux Shell Stack Profiles
# =============================================================================
# Defines selectable "stacks" of user-facing shell components and the
# packages / autostart lines each profile maps to.
#
# Add a new profile by:
#   1. Appending its key to PROFILES
#   2. Defining PROFILE_<key>_NAME / _DESC
#   3. Filling in the per-slot SLOT_<key>_<slot> + EXEC_<key>_<slot> entries
#   4. Listing PROFILE_<key>_OFFICIAL_PACKAGES / _AUR_PACKAGES
#
# COMPONENT SLOTS (extend freely — keep both profiles in sync):
#   bar             — top status bar
#   notifications   — daemon + popups + control center
#   launcher        — app launcher (currently rofi everywhere)
#   volume_osd      — volume / brightness OSD (currently swayosd)
#   app_menu        — global menu / dock (reserved)
#   power_menu      — power menu (currently rofi-driven)
#
# Empty SLOT_*  → component absorbed into another (e.g. quickshell handles
#                 bar+notifications in one process). Empty EXEC_* → no
#                 exec-once line written for that slot.
# =============================================================================

PROFILES=("default" "quickshell")
DEFAULT_PROFILE="quickshell"

# -----------------------------------------------------------------------------
# Profile: default — original cloudyy-linux stack
# -----------------------------------------------------------------------------
PROFILE_default_NAME="Default — Waybar + SwayNC"
PROFILE_default_DESC="Mature, battle-tested. Separate processes per component."

PROFILE_default_OFFICIAL_PACKAGES=("waybar" "swaync")
PROFILE_default_AUR_PACKAGES=("swayosd")

SLOT_default_bar="waybar"
SLOT_default_notifications="swaync"
SLOT_default_launcher="rofi"
SLOT_default_volume_osd="swayosd"
SLOT_default_app_menu=""
SLOT_default_power_menu="rofi"

EXEC_default_bar="waybar"
EXEC_default_notifications="swaync"
EXEC_default_launcher=""   # rofi launches on keybind, no daemon
EXEC_default_volume_osd="swayosd-server"
EXEC_default_app_menu=""
EXEC_default_power_menu=""

# -----------------------------------------------------------------------------
# Profile: quickshell — unified QML shell (Frutiger Aero / cloudy)
# -----------------------------------------------------------------------------
PROFILE_quickshell_NAME="Quickshell — unified QML shell"
PROFILE_quickshell_DESC="One QML process. Bar, notifications, and sliders/OSD in one place."

PROFILE_quickshell_OFFICIAL_PACKAGES=("quickshell")
PROFILE_quickshell_AUR_PACKAGES=()

SLOT_quickshell_bar="quickshell"
SLOT_quickshell_notifications="quickshell"
SLOT_quickshell_launcher="rofi"      # not yet replaced
SLOT_quickshell_volume_osd="quickshell"
SLOT_quickshell_app_menu=""
SLOT_quickshell_power_menu="rofi" # not yet replaced

EXEC_quickshell_bar="env QS_NO_RELOAD_POPUP=1 qs -d"
EXEC_quickshell_notifications="" # absorbed into qs -d
EXEC_quickshell_launcher=""
EXEC_quickshell_volume_osd=""
EXEC_quickshell_app_menu=""
EXEC_quickshell_power_menu=""
