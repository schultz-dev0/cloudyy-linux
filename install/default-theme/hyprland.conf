# cloudyy-linux — Hyprland configuration
# This file is deployed once on first install and is never updated by the repo.
# Edit freely — your changes are local only and will not be overwritten by git pull.

# Theme colours (generated by matugen / theme_controller.sh)
source = ~/.config/matugen/generated/hyprcolors.conf

# Look and feel (gaps, borders, rounding, shadows)
source = ~/.config/hypr/source/lookandfeel.conf

# Monitor layout
source = ~/.config/hypr/source/monitors.conf

# Input (keyboard, touchpad, mouse)
source = ~/.config/hypr/source/input.conf

# Window rules
source = ~/.config/hypr/source/windowrules.conf

# Animations
source = ~/.config/hypr/source/animations.conf

# Variables ($mainMod etc.)
source = ~/.config/hypr/source/variables.conf

# Autostart applications
source = ~/.config/hypr/source/autostart.conf

# Quickshell
source = ~/.config/hypr/source/quickshell.conf

# Keybinds
source = ~/.config/hypr/source/bindings.conf
