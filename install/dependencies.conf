#!/bin/bash
# dependencies.conf

# ============================================================================
# MANDATORY: CORE HYPRLAND & SYSTEM
# (These will ALWAYS be installed)
# ============================================================================
CORE_PACKAGES=(
  "hyprland"
  "hypridle"
  "hyprlock"
  "hyprpolkitagent"
  "xdg-desktop-portal-hyprland"
  "wayland"
  "qt5-wayland"
  "qt6-wayland"
  "polkit-gnome" # Fallback auth agent
)

# ============================================================================
# MANDATORY: INTERFACE & THEMING
# (Required for your dotfiles to look/work correctly)
# ============================================================================
INTERFACE_PACKAGES=(
  "waybar"           # Status bar
  "waybar-mpris-git" # AUR: Media controls for waybar
  "swaync"           # Notification center
  "rofi"             # App Launcher
  "swww"             # Wallpaper Daemon
  "waypaper"         # GUI for wallpapers
  "mako"             # Notification Daemon (Legacy/Backup)
  "wlogout"          # Logout menu
  "nwg-look"         # GTK Settings
  "adw-gtk-theme"
  "orchis-theme"
  "matugen" # Material You Theme Generator
  "ttf-jetbrains-mono-nerd"
  "noto-fonts-emoji"
  "otf-monocraft" # Your custom font
)

# ============================================================================
# MANDATORY: UTILITIES & SHELL
# (Required for scripts, terminal, and system management)
# ============================================================================
UTILITY_PACKAGES=(
  "kitty" # Terminal
  "zsh"
  "zsh-autosuggestions-git"
  "zsh-syntax-highlighting-git"
  "neovim"
  "fastfetch" # System Fetch
  "btop"      # System Monitor
  "thunar"    # File Manager
  "gvfs"      # Thunar mounting support
  "thunar-archive-plugin"
  "file-roller"
  "jq"    # JSON Parsing (Crucial for Hyprland scripts)
  "socat" # Socket handling
  "fzf"   # Fuzzy finder
  "ripgrep"
  "eza" # ls replacement (common in modern configs)
  "zram-generator"
  "brightnessctl"
  "pamixer" # PulseAudio Mixer (Crucial for volume keys)
  "pavucontrol"
  "playerctl"    # Media control
  "grim"         # Screenshots
  "slurp"        # Region select
  "wl-clipboard" # Clipboard
  "swappy"       # Screenshot editor (Recommended)
  "hyprcap"      # Your screen capture tool
  "cliphist"     # Clipboard history
  "bluez"
  "bluez-utils"
  "blueman"
  "firefox"         # core browser
  "python-pywalfox" # theming
  "bottles"
)

# ============================================================================
# GPU DRIVERS (Hardware Dependent - Script selects these)
# ============================================================================
GPU_NVIDIA=(
  "nvidia-open-dkms"
  "nvidia-utils"
  "lib32-nvidia-utils"
  "nvidia-settings"
  "wlroots-nvidia"
)

GPU_AMD=(
  "mesa"
  "lib32-mesa"
  "vulkan-radeon"
  "lib32-vulkan-radeon"
  "libva-mesa-driver"
)

GPU_INTEL=(
  "mesa"
  "lib32-mesa"
  "vulkan-intel"
  "lib32-vulkan-intel"
  "intel-media-driver"
)

