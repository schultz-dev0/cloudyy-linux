#!/usr/bin/env bash
# =============================================================================
# dependencies.conf — cloudyy-linux Package Manifest
# =============================================================================
# Built from your actual `pacman -Qe` output. Every package here was verified
# against your real install.
#
# TIERS
#   MANDATORY_*   → Hyprland or your dotfiles will not function without these.
#                   Always installed, no prompts.
#
#   CHOICE_*      → Pick exactly one per category.
#                   Format: "package|Label|official_or_aur"
#                   CHOICE_*_DEFAULT = 1-based index of the pre-selected option.
#
#   OPTIONAL_*    → Additive groups. User picks y/n per block.
#
#   GPU_*         → Hardware drivers, selected at runtime by lspci detection.
#
# AUR packages are in AUR_* / aur-typed CHOICE entries.
# =============================================================================

# =============================================================================
# MANDATORY — always installed
# =============================================================================

# python-pyqt6 python-pyqt6-webengine openconnect irrelevant dependencies

# --- Compositor Core ----------------------------------------------------------
# Hyprland won't start without every single one of these.
MANDATORY_OFFICIAL_COMPOSITOR=(
  "hyprland"
  "uwsm"                        # Session manager — proper Hyprland startup
  "xdg-desktop-portal-hyprland" # Screen sharing, file picker
  "xdg-desktop-portal-gtk"      # GTK fallback portal
  "qt5-wayland"
  "qt6-wayland"
  "hyprpolkitagent"     # Authentication dialogs
  "xdg-terminal-exec"   # Default terminal discovery
  "xf86-input-libinput" # Input device driver
  "xorg-xhost"          # Xwayland app compatibility
)

# --- Hyprland Daemons ---------------------------------------------------------
# All referenced by your dotfiles: keybinds, autostart, or config.
MANDATORY_OFFICIAL_DAEMONS=(
  "hypridle"   # Idle → lock/suspend trigger
  "hyprlock"   # Lock screen
  "hyprsunset" # Blue light filter (keybind in dotfiles)
  "hyprpicker" # Colour picker
)
MANDATORY_AUR_DAEMONS=(
  "swayosd"   # Volume/brightness OSD — keybinds pipe through this (AUR)
  "hyprshade" # Shader effects / advanced blue-light (Hyprland plugin)
  "hyprcap"   # Screen capture daemon (confirmed real: v1.5.1)
)

# --- Audio Stack --------------------------------------------------------------
# pamixer = volume keybinds. playerctl = media key keybinds. Both required.
MANDATORY_OFFICIAL_AUDIO=(
  "pipewire-alsa"       # ALSA compatibility
  "pipewire-pulse"      # PulseAudio compatibility
  "gst-plugin-pipewire" # GStreamer → PipeWire bridge
  "pamixer"             # CLI volume control (keybinds)
  "playerctl"           # MPRIS media control (media keybinds)
  "pavucontrol"         # GUI audio mixer
)

# --- Desktop Interface --------------------------------------------------------
# Components common to every shell stack. Stack-specific extras (waybar /
# swaync / quickshell …) live in shell-stack.conf and are added at install
# time via apply-shell-stack.sh.
MANDATORY_OFFICIAL_INTERFACE=(
  "rofi" # App launcher (keybinds depend on this)
  "swww" # Wallpaper daemon
)
MANDATORY_AUR_INTERFACE=(
  "wlogout"  # Power/session menu (keybind in dotfiles)
  "waypaper" # GUI wallpaper picker (wraps swww)
)

# --- Screenshot & Clipboard ---------------------------------------------------
MANDATORY_OFFICIAL_SCREENSHOT=(
  "grim"         # Screenshot capture
  "slurp"        # Region/window selection
  "swappy"       # Screenshot annotation
  "wl-clipboard" # Wayland clipboard (wl-copy / wl-paste)
  "cliphist"     # Clipboard history daemon
  "wtype"        # Synthetic key injection for native Wayland windows (clipboard script)
  "xdotool"      # Synthetic key injection for XWayland windows — Firefox, Obsidian, etc. (clipboard script)
)

# --- Shell & Prompt -----------------------------------------------------------
# Your .zshrc sources these directly. Not optional if using the dotfiles.
MANDATORY_OFFICIAL_SHELL=(
  "zsh"
  "zsh-autosuggestions"
  "zsh-syntax-highlighting"
  "starship" # Prompt — defined in your dotfiles
)

# --- System Utilities ---------------------------------------------------------
# jq/socat/inotify-tools are imported by Hyprland helper scripts at runtime.
# stow is required by deploy-dotfiles.sh.
MANDATORY_OFFICIAL_SYSTEM=(
  "jq"            # JSON — used by Hyprland/waybar scripts
  "socat"         # Sockets — used by Hyprland IPC scripts
  "inotify-tools" # File watching — live-reload scripts
  "brightnessctl" # Backlight control keybinds
  "networkmanager"
  "network-manager-applet" # NM system tray
  "nm-connection-editor"   # NM GUI editor
  "bluez"
  "bluez-utils"    # bluetoothctl
  "pacman-contrib" # checkupdates, pacdiff, rankmirrors
  "man-db"         # Manual pages
  "stow"           # Symlink management utility (general use)
  "git"            # Required for AUR builds + dotfiles
  "base-devel"     # Required for AUR (makepkg)
  "rsync"          # Used by deploy scripts + general use
  "wget"           # Used by install scripts
  "nano"           # Fallback editor (pre-neovim install)
  "sof-firmware"   # Audio firmware (Intel HDA, DMIC)
  "unzip" "zip"    # Common archive tools
  "unrar"          # RAR extraction
  "cpio"           # Archive tool (used during AUR builds)
  "gnome-keyring"  # Secret storage (SSH keys, passwords)
  "zram-generator" # Compressed swap in RAM (configured post-install)
)

# --- Theming ------------------------------------------------------------------
# matugen IS your theming engine — dotfiles call it directly to regenerate
# colours on wallpaper change. fluent-icon-theme is in your dotfiles config.
MANDATORY_OFFICIAL_THEMING=(
  "nwg-look"                          # GTK theme/font/icon switcher
  "adw-gtk-theme"                     # GTK3 → libadwaita style match
  "adwaita-qt5"                       # Qt5 → Adwaita style
  "adwaita-qt6"                       # Qt6 → Adwaita style
  "qt5ct"                             # Qt5 theme configurator
  "qt6ct"                             # Qt6 theme configurator
  "kvantum"                           # Qt SVG theme engine
  "ttf-jetbrains-mono-nerd"           # Primary font (waybar icons, kitty, rofi)
  "noto-fonts-emoji"                  # Emoji rendering
  "ttf-material-symbols-variable-git" # Needed for macOS waybar
  "sassc"                             # SCSS → CSS compiler (theme build scripts)
  "webp-pixbuf-loader"                # WebP image support in GTK apps
  "resvg"                             # SVG renderer (used by some Hyprland tools)
  "libcanberra"                       # GTK sound events
  "webkitgtk-6.0"                     # WebKit engine (required by polkit agent, GNOME apps)
)
MANDATORY_AUR_THEMING=(
  "matugen"               # Material You colour generator (core to dotfiles)
  "fluent-icon-theme-git" # Icon theme referenced in your dotfiles
  "python-pywalfox"       # Firefox colour theming via pywal
)

# --- System Monitoring --------------------------------------------------------
MANDATORY_OFFICIAL_MONITORING=(
  "btop"      # Resource monitor
  "fastfetch" # System info (called on shell startup in your config)
  "nvtop"     # GPU monitor (Intel/AMD/NVIDIA)
)

# =============================================================================
# CHOICES — pick exactly one per category
# Format per entry:  "package_name|Display text|official_or_aur"
# "none|...|none" = skip this category
# =============================================================================

# --- Terminal -----------------------------------------------------------------
# NOTE: Both kitty and foot are currently on your system.
# Choosing one here sets the *default* terminal for the session.
CHOICE_TERMINAL=(
  "kitty|Kitty       (GPU-accelerated — your dotfiles default)|official"
  "foot|Foot         (lightweight, Wayland-native — also installed)|official"
  "alacritty|Alacritty  (fast, cross-platform, GPU-accelerated)|official"
  "wezterm|WezTerm    (Lua-configurable, multiplexer built-in)|official"
)
CHOICE_TERMINAL_DEFAULT=1 # kitty

# --- File Manager -------------------------------------------------------------
# NOTE: Both thunar and nautilus are currently on your system.
CHOICE_FILEMANAGER=(
  "thunar|Thunar    (lightweight — your current install)|official"
  "nautilus|Nautilus (GNOME Files — also installed)|official"
  "dolphin|Dolphin   (KDE, most features)|official"
  "none|None       (skip)|none"
)
CHOICE_FILEMANAGER_DEFAULT=1 # thunar

# Extra packages that are automatically installed alongside each file manager.
# Space-separated, all official unless they're in AUR (handled separately).
CHOICE_FILEMANAGER_EXTRAS_thunar="thunar-archive-plugin thunar-volman tumbler gvfs gvfs-mtp gvfs-nfs gvfs-smb file-roller"
CHOICE_FILEMANAGER_EXTRAS_nautilus="gvfs gvfs-mtp gvfs-nfs gvfs-smb"
CHOICE_FILEMANAGER_EXTRAS_dolphin="dolphin-plugins gvfs gvfs-mtp ark kio-extras"

# --- Browser ------------------------------------------------------------------
# NOTE: Firefox is installed and has pywalfox theming in your dotfiles.
CHOICE_BROWSER=(
  "firefox|Firefox    (installed — dotfiles pywalfox theming works with this)|official"
  "chromium|Chromium  (open-source Chrome base, official repo)|official"
  "brave-bin|Brave     (privacy-focused, ad-blocking built-in)|aur"
  "none|None       (skip — already have one installed)|none"
)
CHOICE_BROWSER_DEFAULT=1 # firefox

# --- Code Editor --------------------------------------------------------------
# NOTE: cursor-bin, vscodium, visual-studio-code-bin, and pycharm are all
# currently on your system. Pick your primary; install extras via optional groups.
CHOICE_EDITOR=(
  "cursor-bin|Cursor    (AI-powered editor — your current main install)|aur"
  "vscodium|VSCodium  (VS Code without Microsoft telemetry)|aur"
  "visual-studio-code-bin|VS Code   (Microsoft binary, full marketplace)|aur"
  "pycharm|PyCharm   (JetBrains Python IDE)|aur"
  "none|None      (use neovim from CLI tools only)|none"
)
CHOICE_EDITOR_DEFAULT=1 # cursor-bin

# --- Terminal Multiplexer -----------------------------------------------------
CHOICE_MULTIPLEXER=(
  "zellij|Zellij   (modern, built-in layouts — your current install)|official"
  "tmux|tmux     (classic, scriptable, widely used)|official"
  "none|None    (skip — just use the terminal)|none"
)
CHOICE_MULTIPLEXER_DEFAULT=1 # zellij

# --- Power Management ---------------------------------------------------------
# ⚠ tlp and power-profiles-daemon CONFLICT with each other. Pick one.
# Your system currently has both installed — this ensures a fresh install picks one.
#   power-profiles-daemon: systemd-native, GNOME power slider support, recommended
#   tlp: more granular, better for older/ThinkPad hardware, needs acpid + acpi_call
CHOICE_POWER=(
  "tlp|TLP + TLP-RDW              (granular battery control, great for ThinkPads)|official"
  "none|None                     (skip — manage manually)|none"
)
CHOICE_POWER_DEFAULT=1
CHOICE_POWER_EXTRAS_tlp="tlp-rdw acpid"
CHOICE_POWER_EXTRAS_tlp_aur="acpi_call"

